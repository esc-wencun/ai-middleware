# Compose 项目名：本项目启动的所有容器、网络都会带上这个前缀，
# 作用是和其他 compose 项目隔离（比如另一套也起了一个 etcd，不会撞名）
name: middle-milvus

# services：这个文件里要启动的所有服务（每个服务 = 一个容器）
services:

  # ============ etcd：Milvus 的"元数据中心" ============
  # Milvus 本身不存"集合/字段/索引定义"这些元数据，而是存到 etcd 里
  # （etcd 是分布式键值存储，角色类似 ZooKeeper）
  etcd:
    # 使用哪个镜像及版本（镜像 = 容器的"安装包模板"）
    image: quay.io/coreos/etcd:v3.5.18
    # 固定容器名；不写的话自动生成（middle-milvus-etcd-1 这种）。
    # 固定名字方便 docker logs/exec 时找到它
    container_name: middle-milvus-etcd
    # 重启策略：容器崩溃自动重启，除非是人为 docker stop 停掉的
    restart: unless-stopped
    # 环境变量：以键值对形式传进容器内部
    environment:
      # bitnami 版镜像默认强制要求设置 root 密码，
      # 这个变量表示"允许不设密码直接跑"（仅限内网学习环境）
      - ALLOW_NONE_AUTHENTICATION=yes
      # 下面两个配合：etcd 每次修改都留历史版本，历史太多会把存储撑爆，
      # 这里设为按"版本号(revision)"模式，保留最近 1000 个版本后自动压缩旧历史
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      # etcd 后端数据大小上限 = 4GB（4294967296 字节），
      # 到上限就拒绝写入，防止把磁盘写满——这是官方推荐值
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      # 每提交 50000 条事务做一次快照（快照 = 数据的完整备份点，用于恢复）
      - ETCD_SNAPSHOT_COUNT=50000
    # 覆盖镜像默认的启动命令，逐个参数解释：
    #   -advertise-client-urls=http://etcd:2379
    #     告诉客户端"通过这个地址来连我"。etcd 是服务名，
    #     compose 会建内部网络，容器之间直接用服务名当域名互相访问
    #   -listen-client-urls http://0.0.0.0:2379
    #     实际监听的地址端口。0.0.0.0 = 监听容器内所有网卡（不挑来源）
    #   --data-dir /etcd
    #     数据存放目录指向容器内的 /etcd（配合下面的挂载落到宿主机）
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      # 目录挂载：冒号左边是宿主机路径，右边是容器内路径
      # ./etcd_data = 本 compose 文件所在目录下的 etcd_data 文件夹
      # 这样 etcd 的数据实际存在宿主机上，容器删了数据还在
      - ./etcd_data:/etcd
    # 健康检查：docker 定期探测容器"是否真的能干活"（进程活着 ≠ 服务正常）
    healthcheck:
      # 探测命令：用 etcd 自带客户端检查本节点健康状态
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s     # 每 15 秒探测一次
      timeout: 10s      # 单次探测超过 10 秒算失败
      retries: 5        # 连续失败 5 次才判定为不健康（防止偶发抖动误判）
      start_period: 30s # 启动后的前 30 秒是"宽限期"，这期间失败不计数
    deploy:
      resources:
        limits:
          # 内存上限 512M：超过就被系统杀掉（OOM），
          # 防止单个容器失控吃光宿主机内存
          memory: 512M

  # ============ MinIO：Milvus 的"对象存储" ============
  # Milvus 把向量数据实体、索引文件、日志等大文件存到 MinIO
  # （MinIO 是开源的 S3 兼容对象存储，可以理解为"私有云网盘"）
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: middle-milvus-minio
    restart: unless-stopped
    environment:
      # MinIO 的管理员账号（默认约定俗成用 minioadmin）
      MINIO_ROOT_USER: minioadmin
      # MinIO 的管理员密码。${MINIO_PASSWORD} 表示从 .env 文件
      # 或系统环境变量里读取，密码不写死在 compose 文件里
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    # MinIO 的启动命令：以服务器模式运行，数据目录为容器内的 /minio_data
    command: minio server /minio_data
    volumes:
      # 把宿主机的 ./minio_data 挂为 MinIO 的数据目录，实现持久化
      - ./minio_data:/minio_data
    healthcheck:
      # 探测命令：mc 是 MinIO 自带的客户端工具，
      # "mc ready local" 检查本服务器是否已就绪可提供服务
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ standalone：Milvus 本体 ============
  # Milvus 完整分布式版要拆 query/data/index 等多个角色分容器部署，
  # "standalone" 单机版把所有角色塞进一个进程，学习/小规模够用
  standalone:
    image: milvusdb/milvus:v2.5.4
    container_name: middle-milvus
    restart: unless-stopped
    # 启动命令：以 standalone（单机）模式运行 Milvus
    command: ["milvus", "run", "standalone"]
    environment:
      # 告诉 Milvus 元数据存哪：etcd 服务名 + 端口（容器间用服务名互联）
      ETCD_ENDPOINTS: etcd:2379
      # 告诉 Milvus 对象存储用哪：minio 服务名 + 9000 端口（MinIO 的 API 端口）
      MINIO_ADDRESS: minio:9000
      # Milvus 登录 MinIO 用的账号密码，要和上面 minio 服务的配置一致
      MINIO_ACCESSKEYID: minioadmin
      MINIO_SECRETACCESSKEY: ${MINIO_PASSWORD}
    volumes:
      # Milvus 自身的运行数据（WAL 日志等）持久化到宿主机 ./data
      - ./data:/var/lib/milvus
    ports:
      # 端口映射：冒号左边 = 宿主机端口，右边 = 容器端口
      # 19530：Milvus 的 gRPC 服务端口，Java/Python SDK 连的就是它
      - "19530:19530"
      # 9091：运维端口，提供健康检查接口、Prometheus 指标等
      - "9091:9091"
    # 启动顺序 + 健康依赖：等依赖项"健康"后才启动本服务
    depends_on:
      etcd:
        # 必须等 etcd 健康检查通过再启动（光"启动了"不够，要"能用"）
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 探测命令：请求本机 9091 的 /healthz 接口，
      # curl -f 表示 HTTP 状态码非 2xx 就算失败
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      # Milvus 启动慢，给 90 秒宽限期再开始计数
      start_period: 90s
    deploy:
      resources:
        limits:
          # Milvus 比较吃内存，给 4G 上限
          memory: 4G

  # ============ attu：Milvus 的网页可视化管理台 ============
  # 相当于 Redis 的 Another Redis Desktop Manager、MySQL 的 Navicat，
  # 浏览器打开就能看集合、数据、索引，不用敲命令
  attu:
    image: zilliz/attu:v2.5.5
    container_name: middle-attu
    restart: unless-stopped
    ports:
      # 宿主机 8082 → 容器 3000（Attu 网页服务跑在容器的 3000 端口）
      # 浏览器访问 http://localhost:8082 即可打开管理界面
      - "8082:3000"
    environment:
      # 告诉 Attu 要连哪个 Milvus：服务名 standalone + 19530 端口
      # （同一 compose 网络内，容器之间用服务名互相访问）
      MILVUS_URL: standalone:19530
    depends_on:
      # 等 standalone 启动后再启动 Attu
      # （这里只写了服务名没写 condition，默认"启动了就行"，不检查健康）
      - standalone
    deploy:
      resources:
        limits:
          memory: 512M
