name: middle-elasticsearch

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
    container_name: middle-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
      bootstrap.memory_lock: "true"
      cluster.name: middle-es
      ingest.geoip.downloader.enabled: "false"
      # CORS：允许浏览器端工具（Elasticvue, localhost:8080）跨源访问 ES API
      http.cors.enabled: "true"
      http.cors.allow-origin: "http://localhost:8080"
      http.cors.allow-headers: "X-Requested-With,Content-Type,Content-Length,Authorization"
      http.cors.allow-methods: "OPTIONS,HEAD,GET,POST,PUT,DELETE"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data:/usr/share/elasticsearch/data
      - ./plugins:/usr/share/elasticsearch/plugins
      - ./ik-config:/usr/share/elasticsearch/config/analysis-ik
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  elasticvue:
    image: cars10/elasticvue:1.16.0
    container_name: middle-elasticvue
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "8080:8080"
    environment:
      # 预配置默认集群。注意：这是浏览器端应用，从用户浏览器直连 ES，
      # 所以 uri 必须是浏览器可达地址（localhost），不能写 compose 服务名
      ELASTICVUE_CLUSTERS: '[{"name":"middle-es","uri":"http://localhost:9200"}]'
    deploy:
      resources:
        limits:
          memory: 256M
